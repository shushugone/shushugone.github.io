<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨天的小访客</title>
<style>
  :root{
    --bg:#161b22;
    --card:#1f2630;
    --text:#e6edf3;
    --muted:#93a3b4;
    --accent:#8fd0b4;
    --border:#2d3947;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #22303c 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;max-width:520px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
    text-align:center;
  }
  .photo{
    width:100%;border-radius:14px;display:block;
    cursor:pointer;
    transition:transform .25s ease;
    will-change:transform;
  }
  .photo:hover{transform:scale(1.015);}
  .photo.boing{animation:boing .5s ease;}
  @keyframes boing{
    0%{transform:scale(1);}
    35%{transform:scale(1.05) rotate(.4deg);}
    70%{transform:scale(.985) rotate(-.4deg);}
    100%{transform:scale(1);}
  }
  h1{
    font-size:20px;font-weight:600;letter-spacing:.06em;
    margin:18px 0 10px;
  }
  .line{
    color:var(--muted);font-size:15px;line-height:1.8;
    min-height:1.8em;
    opacity:1;transition:opacity .22s ease;
  }
  .line.fading{opacity:0;}
  .btn{
    margin-top:16px;
    appearance:none;border:1px solid var(--border);
    background:linear-gradient(180deg,#242f3b,#1d2733);
    color:var(--accent);
    font-size:14px;letter-spacing:.08em;
    padding:10px 22px;border-radius:999px;
    cursor:pointer;
    transition:border-color .2s ease, transform .1s ease;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:scale(.97);}
  .hint{margin-top:12px;font-size:12px;color:#5d6f80;}
</style>
</head>
<body>
  <main class="card">
    <img id="photo" class="photo" src="rainy-girl.jpg" alt="雨天屋檐下的小女孩和蜗牛">
    <h1>雨天的小访客</h1>
    <p id="line" class="line">雨天，屋檐下。她在看一只小蜗牛。</p>
    <button id="next" class="btn" type="button">换 一 句</button>
    <p class="hint">点图片，她会有反应</p>
  </main>

<script>
  var lines = [
    "雨天，屋檐下。她在看一只小蜗牛。",
    "你也是来躲雨的吗？",
    "雨还在下，好奇还没看完。",
    "慢一点，也没关系。"
  ];
  var i = 0;
  var lineEl = document.getElementById('line');
  var photoEl = document.getElementById('photo');

  document.getElementById('next').addEventListener('click', function(){
    i = (i + 1) % lines.length;
    lineEl.classList.add('fading');
    setTimeout(function(){
      lineEl.textContent = lines[i];
      lineEl.classList.remove('fading');
    }, 220);
  });

  photoEl.addEventListener('click', function(){
    photoEl.classList.remove('boing');
    void photoEl.offsetWidth; /* 重置动画 */
    photoEl.classList.add('boing');
  });
</script>
</body>
</html>
